# Goal RAG Configuration
# Location: crates/goal-rag/config.toml

# Backend: "local" (Ollama + HNSW) or "gcp" (Vertex AI + Gemini + GCS)
backend = "gcp"

[server]
host = "0.0.0.0"
port = 8080
enable_cors = true
max_upload_size = 104857600  # 100MB

[embeddings]
model = "nomic-embed-text"
dimensions = 768
batch_size = 32
max_length = 256
cache_dir = "/tmp/ruvector-rag/models"

[chunking]
chunk_size = 1024
chunk_overlap = 200
min_chunk_size = 100
respect_sentences = true

[llm]
# Used as fallback when GCP is unavailable
base_url = "http://localhost:11434"
embed_model = "nomic-embed-text"
generate_model = "phi3"
temperature = 0.3
timeout_secs = 120
max_retries = 2
context_size = 4096

[vector_db]
storage_path = "/var/lib/ruvector-rag/vectors.db"
hnsw_m = 32
hnsw_ef_construction = 200
hnsw_ef_search = 100

[external_parser]
enabled = true
unstructured_url = "https://api.unstructured.io/general/v0/general"
use_libreoffice_fallback = true
prefer_local_tools = true
unstructured_api_key = ""  # Set via UNSTRUCTURED_API_KEY env var

[processing]
file_timeout_secs = 600
parallel_files = 2
parallel_embeddings = 2

[processing.tiered]
enabled = true
# Timeouts per tier (in seconds)
fast_timeout_secs = 300      # 5 minutes for <10MB files
medium_timeout_secs = 600    # 10 minutes for 10-100MB files
heavy_timeout_secs = 1200    # 20 minutes for 100MB-1GB files
complex_timeout_secs = 1800  # 30 minutes for scanned/encrypted PDFs

# ============================================================
# GCP Configuration (required when backend = "gcp")
# ============================================================
[gcp]
# Path to your service account JSON key file
service_account_key_path = "/home/kpnaidu/rag-key.json"

# Your GCP project ID
project_id = "goalign-alpha"

# GCP region for Vertex AI
location = "us-central1"

# GCS bucket for storing documents
gcs_bucket = "goalign-rag-bucket"

# Prefixes for organizing files in GCS
gcs_originals_prefix = "originals/"
gcs_plaintext_prefix = "plaintext/"

# Vertex AI Vector Search endpoint (full resource name)
# Create at: https://console.cloud.google.com/vertex-ai/matching-engine
vector_search_endpoint = "projects/1040167267396/locations/us-central1/indexEndpoints/321991980194201600"
vector_search_index = "projects/1040167267396/locations/us-central1/indexes/6426682847746064384"
vector_search_public_domain = "399775135.us-central1-1040167267396.vdb.vertexai.goog"

# Deployed index ID within the endpoint
deployed_index_id = "rag_deployed_index_1766611672753"

# Models (defaults shown)
embedding_model = "text-embedding-005"
generation_model = "gemini-2.5-pro"

# HYBRID MODE SELECTION
# Choose how to balance local vs cloud services:
#
# "full_gcp"      - Vertex AI embeddings + Vertex AI vectors + Gemini LLM
#                   Best quality, but most expensive and rate-limited
#
# "hybrid_vertex" - Ollama embeddings + Vertex AI vectors + Gemini LLM
#                   Saves embedding costs, still uses Vertex for vector storage
#                   (Can still hit Vertex rate limits during bulk ingestion)
#
# "hybrid_local"  - Ollama embeddings + Local HNSW + GCS storage + Gemini LLM
#                   NO RATE LIMITS during ingestion! Only Gemini calls for answers.
#                   Best for bulk ingestion without API throttling.
#                   Documents still backed up to GCS.
#
hybrid_mode = "hybrid_local"

# DEPRECATED: use hybrid_mode instead (kept for backward compatibility)
# use_local_embeddings = true  # equivalent to hybrid_mode = "hybrid_vertex"

